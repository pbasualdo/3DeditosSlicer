name: 3DEDITOS Weekly Sync & Safety Audit

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 09:00 UTC
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  sync-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Profile Safety Validation
        run: |
          python validate_profile.py

      - name: Run Snapmaker Wiki & Releases Sync
        run: |
          python sync_snapmaker_updates.py

      - name: Commit & Push Sync Report
        run: |
          git config user.name "3DEDITOS [AI Agent]"
          git config user.email "3deditos-agent@users.noreply.github.com"
          git add sync_report.md
          if git diff --staged --quiet; then
            echo "No new updates found. Working tree clean."
          else
            git commit -m "chore(agent): weekly sync update report [skip ci]"
            git push origin main
          fi
